<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PACHI ROGUE"/>
<meta name="theme-color" content="#0a0d12"/>
<title>PACHI ROGUE v3</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a0d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
  #wrap{height:100%;display:flex;flex-direction:column;position:relative}
  #top{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;padding:7px;background:#131722}
  .stat{background:#202637;border-radius:9px;padding:6px 4px;text-align:center;font-size:10px;min-width:0}
  .stat b{display:block;font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden}
  #game{flex:1;width:100%;height:100%;display:block;touch-action:none}
  #controls{background:#131722;padding:7px;display:grid;grid-template-columns:1fr 1fr 1.15fr 1.15fr;gap:7px}
  button{border:0;border-radius:11px;padding:12px 8px;font-weight:900;font-size:13px}
  #fire{background:#ff3b30;color:#fff}
  #auto{background:#ffcc00;color:#111}
  #weak{background:#4aa3ff;color:white}
  #strong{background:#af52de;color:white}
  button:disabled{opacity:.25}
  .ctrl{font-size:10px;background:#202637;border-radius:10px;padding:7px}
  .ctrl label{display:flex;justify-content:space-between;margin-bottom:4px}
  .ctrl input{width:100%}
  #rightPanel{display:none;grid-column:1/-1;grid-template-columns:1fr 1fr 1.4fr;gap:7px;align-items:center}
  #techPanel{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  #techPanel button{background:#2b3347;color:#fff}
  #techPanel button.on{background:#34c759;color:#07130b}
  #rightInfo{background:#281f35;border:1px solid #af52de;border-radius:10px;padding:7px;text-align:center;font-size:11px}
  #rightInfo b{font-size:15px}
  #tip{grid-column:1/-1;font-size:10px;opacity:.74;text-align:center;min-height:12px}
  #bookBtn{grid-column:1/-1;background:#334155;color:#fff}
  #lcdWrap{position:absolute;left:50%;top:18%;transform:translateX(-50%);width:min(72vw,520px);height:210px;pointer-events:none;z-index:4}
  #lcd{width:100%;height:100%;border-radius:18px;background:linear-gradient(180deg,#111827,#0b1220);border:3px solid #39445e;box-shadow:0 0 26px rgba(0,0,0,.55) inset,0 8px 30px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;gap:14px;overflow:hidden;position:relative}
  .digit{font-size:92px;font-weight:1000;line-height:1;color:#f8fafc;text-shadow:0 4px 10px #000;min-width:72px;text-align:center}
  .digit.spin{animation:digitPulse .18s linear infinite}
  @keyframes digitPulse{0%{transform:translateY(-4px);opacity:.7}50%{transform:translateY(4px);opacity:1}100%{transform:translateY(-4px);opacity:.7}}
  #lcdText{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-weight:900;font-size:17px;letter-spacing:.06em}
  #roleObj{position:absolute;left:50%;top:-120px;transform:translateX(-50%);width:190px;height:72px;border-radius:0 0 24px 24px;background:linear-gradient(180deg,#eab308,#f59e0b);box-shadow:0 0 24px rgba(245,158,11,.75);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:1000;color:#231600;transition:top .28s cubic-bezier(.2,.9,.25,1.2);z-index:6}
  #roleObj.drop{top:0}
  #flashLayer{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;background:rgba(255,0,0,.26);transition:opacity .08s}
  #flashLayer.on{opacity:1}
  #bookPanel{max-height:70vh;overflow:auto}
  .bookRow{background:#202637;border-radius:10px;padding:9px;margin:7px 0;font-size:12px}
  .bookRow.locked{opacity:.42}
  .bookRow b{display:block;margin-bottom:3px}
  .tag{display:inline-block;padding:2px 6px;border-radius:999px;background:#2f3b52;font-size:10px;margin-right:4px}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
  #panel{width:min(650px,100%);background:#171c28;border-radius:18px;padding:18px}
  #panel h2{margin:0 0 8px}
  #choices{display:grid;gap:10px;margin-top:14px}
  .choice{background:#252d40;color:#fff;text-align:left;padding:14px}
  .choice strong{display:block;font-size:16px;margin-bottom:5px}
  .choice span{opacity:.8;font-size:13px}
  #msg{position:fixed;top:82px;left:50%;transform:translateX(-50%);font-weight:950;font-size:26px;text-shadow:0 2px 9px #000;pointer-events:none;opacity:0;transition:.15s;z-index:8;white-space:nowrap}
  @media(max-width:700px){
    #top{grid-template-columns:repeat(4,1fr)}
    .stat:nth-child(n+5){font-size:9px}
    .stat b{font-size:14px}
  }

  :root{
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html,body{
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  body{
    padding-top:var(--safe-top);
    padding-bottom:var(--safe-bottom);
  }
  #wrap{
    min-height:100dvh;
    height:100dvh;
    overflow:hidden;
  }
  #top{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:repeat(4,1fr)!important;
    gap:4px!important;
    padding:5px 6px!important;
    background:rgba(19,23,34,.97)!important;
    z-index:20;
  }
  .stat{
    padding:5px 3px!important;
    font-size:9px!important;
    border-radius:8px!important;
  }
  .stat b{font-size:13px!important;margin-top:1px!important}
  #lcdWrap{
    position:absolute!important;
    top:104px!important;
    left:50%!important;
    width:calc(100vw - 24px)!important;
    max-width:430px!important;
    height:155px!important;
    transform:translateX(-50%)!important;
    z-index:8!important;
  }
  #lcd{
    border-radius:15px!important;
    gap:8px!important;
    border-width:2px!important;
  }
  .digit{
    font-size:68px!important;
    min-width:54px!important;
  }
  #lcdText{
    bottom:8px!important;
    font-size:14px!important;
  }
  #roleObj{
    width:150px!important;
    height:55px!important;
    font-size:18px!important;
  }
  #game{
    position:absolute;
    left:0;
    right:0;
    top:250px;
    bottom:238px;
    width:100%!important;
    height:auto!important;
    z-index:1;
  }
  #controls{
    position:absolute!important;
    left:0;right:0;bottom:0;
    height:238px;
    padding:7px 8px calc(8px + var(--safe-bottom))!important;
    display:grid!important;
    grid-template-columns:1fr 1fr 1fr!important;
    grid-template-rows:42px 46px 1fr!important;
    gap:6px!important;
    background:linear-gradient(180deg,rgba(19,23,34,.98),rgba(8,10,15,.995))!important;
    z-index:25;
    box-shadow:0 -6px 24px rgba(0,0,0,.5);
  }
  #fire,#auto{display:none!important}
  .ctrl{
    min-width:0;
    padding:5px!important;
    font-size:9px!important;
    grid-row:1;
  }
  .ctrl:nth-of-type(1){grid-column:1/2}
  .ctrl:nth-of-type(2){grid-column:2/3}
  #rightPanel{
    grid-column:1/-1!important;
    grid-row:2!important;
    grid-template-columns:1fr 1fr 1.1fr!important;
    gap:6px!important;
    align-items:stretch!important;
  }
  #rightPanel button{
    padding:7px 5px!important;
    font-size:12px!important;
  }
  #rightInfo{padding:4px!important;font-size:9px!important}
  #rightInfo b{font-size:12px!important}
  #techPanel,#bookBtn,#tip{display:none!important}

  #iphoneDock{
    display:grid!important;
    grid-column:1/-1;
    grid-row:3;
    grid-template-columns:126px 1fr;
    gap:8px;
    min-height:0;
  }
  #handleZone{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:0;
  }
  #handle{
    width:112px;
    height:112px;
    border-radius:50%;
    position:relative;
    background:
      radial-gradient(circle at 50% 50%,#2b3347 0 24%,#111827 25% 49%,#3a4358 50% 58%,#0b0f17 59% 100%);
    border:3px solid #59647b;
    box-shadow:inset 0 0 18px rgba(255,255,255,.08),0 5px 18px rgba(0,0,0,.55);
    touch-action:none;
  }
  #handleKnob{
    position:absolute;
    width:16px;height:34px;
    border-radius:999px;
    left:50%;top:8px;
    transform:translateX(-50%);
    transform-origin:8px 48px;
    background:linear-gradient(#f8fafc,#aab3c6);
    box-shadow:0 2px 5px rgba(0,0,0,.5);
  }
  #handleCenter{
    position:absolute;
    inset:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:10px;
    font-weight:900;
    color:#dbeafe;
    background:#121826;
    border:1px solid #45516a;
  }
  #mobileActions{
    min-width:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr 1fr;
    gap:6px;
  }
  .mBtn{
    border:0;border-radius:11px;
    font-weight:900;
    font-size:12px;
    padding:6px;
    color:#fff;
    background:#293246;
  }
  #mStop{background:#ef4444}
  #mWeak{background:#3b82f6}
  #mStrong{background:#a855f7}
  #mTech{background:#22c55e;color:#07110a}
  #mBook{background:#475569}
  #mAuto{background:#facc15;color:#17120a}
  #powerBar{
    position:absolute;
    right:14px;
    top:268px;
    width:12px;
    bottom:250px;
    border-radius:999px;
    background:#111827;
    border:1px solid #475569;
    overflow:hidden;
    z-index:7;
  }
  #powerFill{
    position:absolute;
    left:0;right:0;bottom:0;
    height:50%;
    background:linear-gradient(180deg,#ef4444,#facc15,#22c55e);
  }
  #powerLabel{
    position:absolute;
    right:29px;
    top:268px;
    font-size:9px;
    z-index:7;
    opacity:.75;
    writing-mode:vertical-rl;
  }
  #mobileHint{
    position:absolute;
    left:8px;
    bottom:244px;
    z-index:8;
    font-size:9px;
    opacity:.72;
    background:rgba(8,10,15,.72);
    padding:4px 6px;
    border-radius:7px;
    pointer-events:none;
  }
  #msg{
    top:calc(var(--safe-top) + 270px)!important;
    font-size:20px!important;
    max-width:92vw;
    text-align:center;
  }
  @media (min-width:700px){
    #wrap{max-width:520px;margin:0 auto;position:relative;box-shadow:0 0 60px rgba(0,0,0,.45)}
    body{background:#02040a}
  }
  @media (orientation:landscape){
    #orientationWarning{display:flex!important}
  }
  #orientationWarning{
    display:none;
    position:fixed;
    inset:0;
    z-index:999;
    background:#080b11;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    font-weight:900;
    font-size:18px;
  }

</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div class="stat">STAGE<b id="stage">1</b></div>
    <div class="stat">敵HP<b id="hp">120</b></div>
    <div class="stat">残り玉<b id="balls">40</b></div>
    <div class="stat">コイン<b id="coins">0</b></div>
    <div class="stat">回転数<b id="spins">0</b></div>
    <div class="stat">1k回転<b id="rpm">0.0</b></div>
    <div class="stat">OVER<b id="overs">0</b></div>
    <div class="stat">保留<b id="holds">0/4</b></div>
    <div class="stat">演出<b id="effect">通常</b></div>
    <div class="stat">RUSH<b id="rushes">0</b></div>
    <div class="stat">法則崩れ<b id="lawbreaks">0</b></div>
    <div class="stat">LT<b id="lts">0</b></div>
  </div>

  <div id="lcdWrap">
    <div id="roleObj">激震役物</div>
    <div id="lcd">
      <div class="digit" id="d1">1</div>
      <div class="digit" id="d2">2</div>
      <div class="digit" id="d3">3</div>
      <div id="lcdText">通常変動</div>
    </div>
  </div>

  <canvas id="game"></canvas>

  <div id="controls">
    <button id="fire">通常打ち</button>
    <button id="auto">AUTO OFF</button>

    <div class="ctrl">
      <label><span>釘調整</span><b id="nailVal">0</b></label>
      <input id="nail" type="range" min="-3" max="3" step="1" value="0">
    </div>

    <div class="ctrl">
      <label><span>捻り</span><b id="twistVal">0%</b></label>
      <input id="twist" type="range" min="0" max="100" step="5" value="0">
    </div>

    <div id="rightPanel">
      <button id="weak">右・弱打ち</button>
      <button id="strong">右・強打ち</button>
      <div id="rightInfo"><span id="modeLabel">RIGHT TIME</span><br><b><span id="count">0</span>/10</b>　残り <b><span id="rt">0.0</span>s</b></div>
    </div>

    <div id="techPanel">
      <button id="stopBtn">止め打ち OFF</button>
      <button id="holdStopBtn">保留4止め OFF</button>
      <button id="oneTwoBtn">ワンツー OFF</button>
      <button id="roundStopBtn">ラウンド間止め OFF</button>
    </div>

    <button id="bookBtn">演出法則図鑑</button>

    <div id="iphoneDock">
      <div id="handleZone">
        <div id="handle" aria-label="発射ハンドル">
          <div id="handleKnob"></div>
          <div id="handleCenter">発射<br><span id="handlePct">50%</span></div>
        </div>
      </div>
      <div id="mobileActions">
        <button class="mBtn" id="mStop">発射停止</button>
        <button class="mBtn" id="mAuto">AUTO</button>
        <button class="mBtn" id="mWeak">右・弱</button>
        <button class="mBtn" id="mStrong">右・強</button>
        <button class="mBtn" id="mTech">技術介入 ON</button>
        <button class="mBtn" id="mBook">図鑑</button>
      </div>
    </div>

    <div id="tip">LTタイプ：通常RUSHから内部昇格、10RからLT直行あり。LT中は専用プレミア演出、さらに超低確率で上位LTへ。</div>
  </div>
</div>

<div id="powerLabel">発射強度</div>
<div id="powerBar"><div id="powerFill"></div></div>
<div id="mobileHint">ハンドルを回すほど強く発射</div>
<div id="orientationWarning">縦画面で遊ぶように設計しています。<br>iPhoneを縦向きにしてください。</div>
<div id="flashLayer"></div>
<div id="msg"></div>
<div id="bookOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:18px;z-index:11">
  <div id="panel">
    <h2>演出法則図鑑</h2>
    <div id="bookPanel"></div>
    <button id="bookClose" style="width:100%;margin-top:12px;background:#ff453a;color:white">閉じる</button>
  </div>
</div>

<div id="overlay">
  <div id="panel">
    <h2 id="panelTitle"></h2>
    <div id="panelText"></div>
    <div id="choices"></div>
  </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const DPR=Math.max(1,Math.min(2,devicePixelRatio||1));
const $=id=>document.getElementById(id);

const ui={
 stage:$("stage"),hp:$("hp"),balls:$("balls"),coins:$("coins"),spins:$("spins"),
 rpm:$("rpm"),overs:$("overs"),holds:$("holds"),effect:$("effect"),rushes:$("rushes"),lawbreaks:$("lawbreaks"),lts:$("lts"),fire:$("fire"),auto:$("auto"),nail:$("nail"),
 nailVal:$("nailVal"),twist:$("twist"),twistVal:$("twistVal"),
 rightPanel:$("rightPanel"),weak:$("weak"),strong:$("strong"),count:$("count"),rt:$("rt"),modeLabel:$("modeLabel"),
 stopBtn:$("stopBtn"),holdStopBtn:$("holdStopBtn"),oneTwoBtn:$("oneTwoBtn"),roundStopBtn:$("roundStopBtn"),
 overlay:$("overlay"),title:$("panelTitle"),text:$("panelText"),choices:$("choices"),msg:$("msg"),
 bookBtn:$("bookBtn"),bookOverlay:$("bookOverlay"),bookPanel:$("bookPanel"),bookClose:$("bookClose"),
 d1:$("d1"),d2:$("d2"),d3:$("d3"),lcdText:$("lcdText"),roleObj:$("roleObj"),flashLayer:$("flashLayer"),lcd:$("lcd"),
 handle:$("handle"),handleKnob:$("handleKnob"),handlePct:$("handlePct"),powerFill:$("powerFill"),
 mStop:$("mStop"),mAuto:$("mAuto"),mWeak:$("mWeak"),mStrong:$("mStrong"),mTech:$("mTech"),mBook:$("mBook")
};

let W=0,H=0, pegs=[], pockets=[], balls=[], particles=[], rightBalls=[];
let startGate={x:0,y:0,w:34,h:18};
let attacker={x:0,y:0,w:0,h:22};

let state={
 stage:1,enemyMax:120,enemyHP:120,ammo:40,coins:0,spins:0,fired:0,
 damage:8,crit:.10,multiball:1,jackpot:1,extraAmmo:0,magnet:0,
 nail:0,twist:0,auto:false,lastAuto:0,shotFlip:false,
 combo:0,bestCombo:0,roundEnded:false,
 rightActive:false,rightEndsAt:0,attackerCount:0,attackerOpen:true,
 attackerCloseAt:0,attackerReopenAt:0,overWindowMs:115,overs:0,
 lastTenthAt:0,

 // technique-intervention systems
 holds:0, maxHolds:4, nextHoldConsumeAt:0,
 stopShoot:false, holdStop:false, oneTwo:false, roundStop:false,
 wastedBalls:0, savedBalls:0, supportOpen:false,
 supportCycleStart:0, supportOpenMs:520, supportClosedMs:880,
 roundIndex:1, roundGap:false, roundGapEndsAt:0,
 rightAmmoUsed:0, supportMisses:0,

 // pachinko演出
 effectState:"通常", effectUntil:0, effectQueue:[],
 baseHitRate:1/18, preflashHitRate:.68, preflashMissRate:.08,
 revivalRate:.24, rushBonusCoins:25, totalHits:0, revivals:0,
 rushes:0, sevenTenRate:.08, silentRushHits:0, sevenTenHits:0,
 lawbreaks:0, confirmedPatterns:0, promotionHits:0, afterscreenRevivals:0,
 hiddenRushPromotions:0,

 // Internal lottery engine (separate from presentation)
 hitDenominator:18,
 rushShare:.52,
 premiumRushShare:.06,
 roundDist:[{r:3,p:.55},{r:5,p:.30},{r:10,p:.15}],
 spinSerial:0,

 // Lucky Trigger
 rushMode:"NONE",
 ltEntries:0,
 ltDirectHits:0,
 ltRushPromotions:0,
 ltContinuations:0,
 ltUpgradeRate:.18,
 ltContinueRate:.78,
 ltPromotionPending:false,
 ltRevealRound:0,
 normalRushMs:15000,
 ltInitialMs:22000,
 ltContinueMs:14000,
 ltRewardMultiplier:2.2,

 // Encyclopedia / premium effects / upper LT
 discovered:{},
 ltPremiumSeen:0,
 upperLTEntries:0,
 upperLTContinueRate:.90,
 upperLTInitialMs:28000,
 upperLTContinueMs:18000,
 upperLTRewardMultiplier:3.8,
 upperLTRateFromLT:.045,
 upperLTActive:false,

 // visual presentation
 reelTimer:null,
 reelStopTimers:[],
 lcdMode:"NORMAL",
 audioReady:false,
 handlePower:.50,
 handleFiring:true,
 mobileTechOn:true,
 mobileLastShot:0
};

function resize(){
 const r=canvas.getBoundingClientRect();
 W=r.width; H=r.height;
 canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 buildBoard();
}
addEventListener("resize",resize);

function buildBoard(){
 pegs=[];
 const rows=9, gapX=Math.max(34,W/10), gapY=Math.max(38,H/13);
 for(let row=0;row<rows;row++){
   const y=58+row*gapY, off=(row%2)*gapX/2;
   for(let x=gapX;x<W-gapX/2;x+=gapX) pegs.push({x:x+off,y,r:5});
 }
 startGate={x:W/2,y:H*.66,w:34+state.nail*5,h:18};
 const n=5,pw=W/n,types=["MISS","DMG","JACKPOT","DMG","COIN"];
 pockets=Array.from({length:n},(_,i)=>({x:i*pw,y:H-55,w:pw,h:55,type:types[i]}));
 attacker={x:W*.70,y:H*.48,w:W*.23,h:22};
}

function flash(text){
 ui.msg.textContent=text; ui.msg.style.opacity=1;
 clearTimeout(flash.t);
 flash.t=setTimeout(()=>ui.msg.style.opacity=0,520);
}

function updateUI(t=performance.now()){
 ui.stage.textContent=state.stage;
 ui.hp.textContent=Math.max(0,Math.ceil(state.enemyHP));
 ui.balls.textContent=state.ammo;
 ui.coins.textContent=state.coins;
 ui.spins.textContent=state.spins;
 ui.rpm.textContent=state.fired?(state.spins/state.fired*250).toFixed(1):"0.0";
 ui.overs.textContent=state.overs;
 ui.holds.textContent=`${state.holds}/${state.maxHolds}`;
 ui.effect.textContent=state.effectState;
 ui.rushes.textContent=state.rushes;
 ui.lawbreaks.textContent=state.lawbreaks;
 ui.lts.textContent=state.ltEntries;
 ui.modeLabel.textContent=state.rushMode==="UPPER_LT"?"ULTIMATE LT":(state.rushMode==="LT"?"LUCKY TRIGGER":(state.rushMode==="NORMAL"?"RUSH":"RIGHT TIME"));
 ui.nailVal.textContent=(state.nail>0?"+":"")+state.nail;
 ui.twistVal.textContent=state.twist+"%";
 ui.auto.textContent=state.auto?"AUTO ON":"AUTO OFF";

function fire(){

   state.savedBalls++;
   flash("保留4止め");
   return;
 }

 state.ammo--; state.fired++; state.shotFlip=!state.shotFlip;
 const tw=state.twist/100;
 const hp=state.handlePower;
 const alt=(state.shotFlip?1:-1)*(.25+tw*1.35);
 const variance=(Math.random()-.5)*(1.3+tw*1.55+(1-hp)*.45);
 for(let i=0;i<state.multiball;i++){
   balls.push({
    x:W/2+(Math.random()-.5)*12,y:18,
    vx:variance+alt+(i-(state.multiball-1)/2)*.8,
    vy:1.45+(state.shotFlip?tw*.18:-tw*.12),r:7,alive:true,passedStart:false
   });
 }
 updateUI();
}

function ensureAudio(){
 if(state.audioReady) return;
 try{
   window._pachiAC = window._pachiAC || new (window.AudioContext||window.webkitAudioContext)();
   state.audioReady=true;
 }catch(e){}
}

function tone(freq=880,dur=.08,type="square",gain=.035){
 ensureAudio();
 const ac=window._pachiAC;
 if(!ac) return;
 const o=ac.createOscillator(), g=ac.createGain();
 o.type=type; o.frequency.value=freq;
 g.gain.value=gain;
 o.connect(g); g.connect(ac.destination);
 const now=ac.currentTime;
 g.gain.setValueAtTime(gain,now);
 g.gain.exponentialRampToValueAtTime(.0001,now+dur);
 o.start(now); o.stop(now+dur);
}

function weightedPick(items){
 const r=Math.random();
 let acc=0;
 for(const item of items){
   acc+=item.p;
   if(r<=acc) return item;
 }
 return items[items.length-1];
}

   };
 }

 return {

function choosePresentation(result){
 // Presentation must never change the internal result.
 // Instead, certain presentations are only assigned to compatible results.

 let tenpai = 1 + Math.floor(Math.random()*9);

 // RUSH-guaranteed presentations may be assigned to RUSH results.
 const canUseRushCert = result.hit && result.rush;
 const forceSeven = canUseRushCert && Math.random() < state.sevenTenRate;
 if(forceSeven) tenpai=7;

 const effects=["ノーマル発展","群予告","役物落下","ブラックアウト","逆回転","月光フリーズ"];
 const effectWeights=[.52,.16,.13,.08,.07,.04];
 let rr=Math.random(),acc=0,specialEffect=effects[0];
 for(let i=0;i<effects.length;i++){
   acc+=effectWeights[i];
   if(rr<=acc){specialEffect=effects[i];break;}
 }

 // Confirmed pattern assignment:
 // If a non-compatible miss randomly lands on a confirmed pair, reroll the effect.
 const confirmedMap={"1":"逆回転","3":"月光フリーズ","5":"群予告","8":"ブラックアウト"};
 let comboConfirmed = confirmedMap[String(tenpai)]===specialEffect;

 if(comboConfirmed && !result.hit){
   specialEffect="ノーマル発展";
   comboConfirmed=false;
 }

 // If the internal result is RUSH, sometimes deliberately assign a known cert pair.
 if(canUseRushCert && Math.random()<.08){
   const pairs=[
     {tenpai:1,effect:"逆回転"},
     {tenpai:3,effect:"月光フリーズ"},
     {tenpai:5,effect:"群予告"},
     {tenpai:8,effect:"ブラックアウト"}
   ];
   const p=pairs[Math.floor(Math.random()*pairs.length)];
   tenpai=p.tenpai; specialEffect=p.effect; comboConfirmed=true;
 }

 // Preflash: silent-hit may only be used when the internal result is RUSH,
 // because "no preflash hit = RUSH" is a game law.
 let preflash;
 if(result.hit){
   if(result.rush && Math.random()<.20) preflash=false;
   else preflash=Math.random()<state.preflashHitRate;
 }else{
   preflash=Math.random()<state.preflashMissRate;
 }

 // Reserve color. Low-color jackpot is a RUSH-cert law in this game.
 let color="白保留";
 const r=Math.random();
 if(result.hit){
   if(result.rush && r<.10) color="白保留";
   else if(result.rush && r<.18) color="青保留";
   else if(r<.32) color="虹保留";
   else if(r<.48) color="金保留";
   else if(r<.72) color="赤保留";
   else color="緑保留";
 }else{
   if(r<.015) color="赤保留";
   else if(r<.07) color="緑保留";
   else if(r<.28) color="青保留";
   else color="白保留";
 }

 // Weak reach jackpot is also RUSH-cert, so only assign weak reach to a RUSH hit.
 let weakReach = specialEffect==="ノーマル発展";
 if(result.hit && !result.rush && weakReach){
   specialEffect="役物落下";
   weakReach=false;
 }

 // Some RUSH results are intentionally disguised as ordinary hits.
 const hiddenRushPromotion =
   result.hit && result.rush && !result.lt &&
   !forceSeven && !comboConfirmed && preflash &&
   color!=="白保留" && color!=="青保留" &&
   !weakReach &&
   Math.random()<.28;

 return {
   tenpai,
   sevenTen: tenpai===7 && result.rush,
   specialEffect,
   comboConfirmed,
   preflash,
   silentHit:result.hit && !preflash,
   color,
   weakReach,
   lawBreak: result.hit && result.rush &&
      ((color==="白保留" || color==="青保留") || weakReach),
   hiddenRushPromotion
 };
}

function rightShot(power){
 if(!state.rightActive||state.roundEnded)return;

 // Round-gap stop shooting: firing here is waste unless the technique is enabled.
 if(state.roundGap){
   if(state.roundStop){
     state.savedBalls++;
     flash("ラウンド間止め");
     return;
   }else{
     state.coins=Math.max(0,state.coins-1);
     state.wastedBalls++;
     flash("ラウンド間の無駄玉");
     return;
   }
 }

 // Electric support timing: opening/closed cycle.
 if(!state.supportOpen){
   if(state.stopShoot){
     state.savedBalls++;
     flash("電サポ止め打ち");
     return;
   }else{
     state.supportMisses++;
     state.wastedBalls++;
   }
 }

 state.rightAmmoUsed++;

 const now=performance.now();
 let base=power==="weak"?760:480;
 let jitter=(Math.random()-.5)*(power==="weak"?46:34);

 // One-two technique narrows travel-time variance and improves catch-up consistency.
 if(state.oneTwo){
   jitter*=0.42;
   if(power==="weak") base+=28;
   if(power==="strong") base-=24;
 }

 rightBalls.push({
   x:W-20,y:45,spawn:now,arrive:now+base+jitter,power,
   trail:[],resolved:false
 });
}
function resolveRightBall(rb,t){
 if(rb.resolved)return;
 rb.resolved=true;
 if(!state.rightActive || !state.attackerOpen || state.roundGap) return;

 // Ball arriving while support is closed is lost unless timing was good.
 if(!state.supportOpen){
   state.supportMisses++;
   state.wastedBalls++;
   return;
 }

 if(state.attackerCount<10){
   state.attackerCount++;
   const modeMul=state.rushMode==="UPPER_LT"?state.upperLTRewardMultiplier:(state.rushMode==="LT"?state.ltRewardMultiplier:1);
   state.coins+=state.rushMode==="UPPER_LT"?5:(state.rushMode==="LT"?3:1);
   state.enemyHP-=state.damage*.25*modeMul;
   burst(attacker.x+attacker.w*.5,attacker.y,7);
   if(state.attackerCount===10){
     state.lastTenthAt=t;
     state.attackerCloseAt=t+state.overWindowMs+(state.rushMode==="UPPER_LT"?30:(state.rushMode==="LT"?15:0));
     flash("10 COUNT! OVERを狙え");
   }
 }else{
   // Only the 11th ball inside the tiny closing window counts as OVER.
   if(t<=state.attackerCloseAt){
     state.overs++;
     state.coins+=state.rushMode==="UPPER_LT"?70:(state.rushMode==="LT"?40:15);
     const modeMul=state.rushMode==="UPPER_LT"?state.upperLTRewardMultiplier:(state.rushMode==="LT"?state.ltRewardMultiplier:1);
     const bonus=state.damage*(4+state.jackpot*.5)*modeMul;
     state.enemyHP-=bonus;
     flash("OVER入賞!! +" + Math.round(bonus) + "DMG");
     state.attackerCloseAt=t+45;
   }
 }
 updateUI(t);
}

function finishAttackerRound(t){
 // LT昇格は内部ではRUSH開始時に決まっており、ここで初めて告知する。
 if(state.rushMode==="NORMAL" &&
    state.ltPromotionPending &&
    state.roundIndex>=state.ltRevealRound){
   state.attackerCount=0;
   state.attackerCloseAt=0;
   setEffect("LT昇格演出",900,t);
   flash("役物再始動…!?");
   queueEffect(900,()=>activateLT(performance.now(),"RUSH中昇格"));
   return;
 }

 state.attackerOpen=false;
 state.roundGap=true;
 const gap=state.rushMode==="LT"?520:900;
 state.roundGapEndsAt=t+gap;
 state.attackerReopenAt=t+gap;
 state.attackerCount=0;
 state.attackerCloseAt=0;
}
function hitPocket(ball,p,t){
 if(!ball.alive)return;
 ball.alive=false;
 let dmg=0;
 if(p.type==="MISS"){state.combo=0;}
 else if(p.type==="DMG"){dmg=state.damage;}
 else if(p.type==="JACKPOT"){
   dmg=state.damage*3*state.jackpot; state.coins+=3; startRight(t,"NORMAL"); flash("JACKPOT → RUSH!");
 }else if(p.type==="COIN"){state.coins+=5;dmg=state.damage*.5;}
 if(dmg>0){
   const crit=Math.random()<state.crit;
   if(crit){dmg*=2;flash("CRITICAL!!");}
   state.enemyHP-=dmg;state.combo++;state.bestCombo=Math.max(state.bestCombo,state.combo);
   burst(ball.x,ball.y,crit?18:8);
 }
 updateUI(t);
 if(state.enemyHP<=0&&!state.roundEnded){state.roundEnded=true;setTimeout(showUpgrade,500);}
}

function burst(x,y,n){
 for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:30});
}

function step(t){
 const cadence=430-(state.handlePower*170);
 if(state.handleFiring && !state.rightActive && !state.roundEnded && state.ammo>0 && t-state.mobileLastShot>cadence){
   fire();
   state.mobileLastShot=t;
 }
 if(state.auto&&!state.roundEnded&&state.ammo>0&&t-state.lastAuto>340){fire();state.lastAuto=t;}

 // Consume one hold periodically: this makes hold-4 stop meaningful.
 if(state.holds>0 && state.nextHoldConsumeAt && t>=state.nextHoldConsumeAt){
   state.holds--;
   resolveSpin(t);
   state.nextHoldConsumeAt = state.holds>0 ? t+900 : 0;
 }

 // Timed演出 queue.
 if(state.effectQueue.length){
   const ready=state.effectQueue.filter(e=>e.at<=t);
   state.effectQueue=state.effectQueue.filter(e=>e.at>t);
   for(const e of ready) e.fn();
 }
 if(state.effectUntil && t>=state.effectUntil && state.effectQueue.length===0){
   state.effectState="通常";
   state.effectUntil=0;
 }

 // Electric support cycle.
 if(state.rightActive){
   const cycle=state.supportOpenMs+state.supportClosedMs;
   const pos=(t-state.supportCycleStart)%cycle;
   state.supportOpen = pos < state.supportOpenMs;
 }

 if(state.rightActive&&t>=state.rightEndsAt){
   if(state.rushMode==="UPPER_LT"){
     if(Math.random()<state.upperLTContinueRate){
       state.ltContinuations++;
       state.rightEndsAt=t+state.upperLTContinueMs;
       state.supportCycleStart=t;
       state.attackerOpen=true;
       state.attackerCount=0;
       state.roundGap=false;
       setEffect("ULTIMATE LT 継続",1200,t);
       flash("神域継続!!");
     }else{
       state.rightActive=false;
       state.attackerOpen=false;
       state.rushMode="NONE";
       state.upperLTActive=false;
       setLcdTheme("NORMAL");
       flash("ULTIMATE LT END");
     }
   }else if(state.rushMode==="LT"){
     const premium=Math.random()<.22 ? ltPremiumEvent(t) : null;

     if(premium==="UPPER_CHANCE" && Math.random()<state.upperLTRateFromLT){
       queueEffect(900,()=>activateUpperLT(performance.now()));
     }else if(premium==="CONTINUE" || Math.random()<state.ltContinueRate){
       state.ltContinuations++;
       state.rightEndsAt=t+state.ltContinueMs;
       state.supportCycleStart=t;
       state.attackerOpen=true;
       state.attackerCount=0;
       state.roundGap=false;
       setEffect(premium?"LTプレミア継続":"LT継続",1100,t);
       flash(premium?"プレミア継続!!":"LUCKY TRIGGER 継続!!");
     }else{
       state.rightActive=false;
       state.attackerOpen=false;
       state.rushMode="NONE";
       setLcdTheme("NORMAL");
       flash("LT END");
     }
   }else{
     const endedMode=state.rushMode;
     state.rightActive=false;
     state.attackerOpen=false;
     state.rushMode="NONE";
     state.ltPromotionPending=false;
     setLcdTheme("NORMAL");
     flash(endedMode==="NORMAL"?"RUSH END":"RIGHT END");
   }
 }
 if(!state.attackerOpen&&state.attackerReopenAt&&t>=state.attackerReopenAt&&state.rightActive){
   state.attackerOpen=true;
   state.attackerReopenAt=0;
   state.attackerCount=0;
   if(state.roundGap){
     state.roundGap=false;
     state.roundIndex++;
     flash("ROUND "+state.roundIndex);
   }else{
     flash("ATTACKER OPEN");
   }
 }
 if(state.attackerOpen&&state.attackerCount>=10&&state.attackerCloseAt&&t>state.attackerCloseAt){
   finishAttackerRound(t);
 }

 for(const rb of rightBalls){
   if(rb.resolved)continue;
   const u=Math.max(0,Math.min(1,(t-rb.spawn)/(rb.arrive-rb.spawn)));
   const sx=W-20,sy=45, ex=attacker.x+attacker.w*.55,ey=attacker.y+attacker.h/2;
   rb.x=sx+(ex-sx)*u;
   rb.y=sy+(ey-sy)*u + Math.sin(u*Math.PI)*(-65);
   if(t>=rb.arrive)resolveRightBall(rb,t);
 }
 rightBalls=rightBalls.filter(rb=>!rb.resolved || t-rb.arrive<150);

 for(const b of balls){
   if(!b.alive)continue;
   b.vy+=.18;if(state.magnet>0)b.vx+=(W/2-b.x)*state.magnet/100;
   b.x+=b.vx;b.y+=b.vy;
   if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)*.85}
   if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.85}
   for(const p of pegs){
     const dx=b.x-p.x,dy=b.y-p.y,d2=dx*dx+dy*dy,rr=b.r+p.r;
     if(d2<rr*rr){
       const d=Math.sqrt(d2)||.01,nx=dx/d,ny=dy/d,overlap=rr-d;
       b.x+=nx*overlap;b.y+=ny*overlap;
       const dot=b.vx*nx+b.vy*ny;b.vx-=1.65*dot*nx;b.vy-=1.65*dot*ny;b.vx+=(Math.random()-.5)*.35;
     }
   }
   if(!b.passedStart&&b.y>=startGate.y-startGate.h/2&&b.y<=startGate.y+startGate.h/2&&Math.abs(b.x-startGate.x)<=startGate.w/2){
     b.passedStart=true;
     if(state.holds < state.maxHolds){
       state.holds++;
       state.spins++;
       state.coins++;
       if(state.nextHoldConsumeAt===0) state.nextHoldConsumeAt=t+900;
     }else{
       state.wastedBalls++;
       flash("保留満タン・無駄玉");
     }
     let dmg=state.damage*.75;const crit=Math.random()<state.crit;if(crit)dmg*=2;
     state.enemyHP-=dmg;state.combo++;state.bestCombo=Math.max(state.bestCombo,state.combo);burst(b.x,b.y,10);b.vy=Math.max(b.vy,2.2);
     flash(crit?"START + CRITICAL!":"START!");updateUI(t);
     if(state.enemyHP<=0&&!state.roundEnded){state.roundEnded=true;setTimeout(showUpgrade,500);}
   }
   if(b.y>H-55){
     const idx=Math.max(0,Math.min(pockets.length-1,Math.floor(b.x/(W/pockets.length))));
     hitPocket(b,pockets[idx],t);
   }
   if(b.y>H+30)b.alive=false;
 }
 balls=balls.filter(b=>b.alive);

 for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--}
 particles=particles.filter(p=>p.life>0);

 if(!state.roundEnded&&state.ammo<=0&&balls.length===0&&state.enemyHP>0&&!state.rightActive)gameOver();
 updateUI(t);
}

 if(state.rightActive){

   ctx.fillText(`OVER猶予 ${effectiveOver}ms`,W-14,90);
   const modeTxt=state.rushMode==="UPPER_LT"?"ULTIMATE LT":(state.rushMode==="LT"?"LT":"RUSH");
   ctx.fillText(`${modeTxt} / 電サポ ${state.supportOpen?"OPEN":"CLOSE"} / R${state.roundIndex}`,W-14,110);
   ctx.textAlign="left";
 }

 ctx.fillStyle="#cbd5e1";
 ctx.font="bold 10px sans-serif";
 ctx.fillText(`無駄玉 ${state.wastedBalls}  |  節約 ${state.savedBalls}  |  右ミス ${state.supportMisses}`,14,H-66);
}

function loop(t){step(t);draw();requestAnimationFrame(loop)}


function setHandlePower(p){
 p=Math.max(0.08,Math.min(1,p));
 state.handlePower=p;
 const deg=-120+p*240;
 ui.handleKnob.style.transform=`translateX(-50%) rotate(${deg}deg)`;
 ui.handlePct.textContent=Math.round(p*100)+"%";
 ui.powerFill.style.height=Math.round(p*100)+"%";
}

function pointerToPower(ev){
 const r=ui.handle.getBoundingClientRect();
 const cx=r.left+r.width/2, cy=r.top+r.height/2;
 const x=ev.clientX-cx, y=ev.clientY-cy;
 let ang=Math.atan2(y,x)*180/Math.PI + 90;
 if(ang>180) ang-=360;
 ang=Math.max(-120,Math.min(120,ang));
 return (ang+120)/240;
}

let handlePointer=null;
ui.handle.addEventListener("pointerdown",ev=>{
 ensureAudio();
 handlePointer=ev.pointerId;
 ui.handle.setPointerCapture(ev.pointerId);
 setHandlePower(pointerToPower(ev));
 state.handleFiring=true;
 ui.mStop.textContent="発射停止";
});
ui.handle.addEventListener("pointermove",ev=>{
 if(handlePointer===ev.pointerId) setHandlePower(pointerToPower(ev));
});
ui.handle.addEventListener("pointerup",ev=>{
 if(handlePointer===ev.pointerId) handlePointer=null;
});

function mobileTechToggle(){
 state.mobileTechOn=!state.mobileTechOn;
 state.holdStop=state.mobileTechOn;
 state.stopShoot=state.mobileTechOn;
 state.oneTwo=state.mobileTechOn;
 state.roundStop=state.mobileTechOn;
 ui.mTech.textContent=state.mobileTechOn?"技術介入 ON":"技術介入 OFF";
 ui.mTech.style.opacity=state.mobileTechOn?1:.5;
 updateUI();
}

ui.mStop.onclick=()=>{
 ensureAudio();
 state.handleFiring=!state.handleFiring;
 ui.mStop.textContent=state.handleFiring?"発射停止":"発射再開";
};
ui.mAuto.onclick=()=>{
 ensureAudio();
 state.auto=!state.auto;
 ui.mAuto.textContent=state.auto?"AUTO ON":"AUTO";
 updateUI();
};
ui.mWeak.onclick=()=>{ensureAudio();rightShot("weak");};
ui.mStrong.onclick=()=>{ensureAudio();rightShot("strong");};
ui.mTech.onclick=mobileTechToggle;
ui.mBook.onclick=()=>{renderBook();ui.bookOverlay.style.display="flex";};

ui.fire.onclick=()=>{ensureAudio();fire();};
ui.auto.onclick=()=>{state.auto=!state.auto;updateUI()};
ui.weak.onclick=()=>rightShot("weak");
ui.strong.onclick=()=>rightShot("strong");
ui.stopBtn.onclick=()=>{state.stopShoot=!state.stopShoot;updateUI()};
ui.holdStopBtn.onclick=()=>{state.holdStop=!state.holdStop;updateUI()};
ui.oneTwoBtn.onclick=()=>{state.oneTwo=!state.oneTwo;updateUI()};
ui.roundStopBtn.onclick=()=>{state.roundStop=!state.roundStop;updateUI()};
ui.bookBtn.onclick=()=>{renderBook();ui.bookOverlay.style.display="flex";};
ui.bookClose.onclick=()=>{ui.bookOverlay.style.display="none";};
ui.nail.oninput=()=>{state.nail=Number(ui.nail.value);buildBoard();updateUI()};
ui.twist.oninput=()=>{state.twist=Number(ui.twist.value);updateUI()};
canvas.addEventListener("pointerdown",()=>{ensureAudio();});
addEventListener("keydown",e=>{
 if(e.code==="Space"){e.preventDefault();fire()}
 if(e.key==="z"||e.key==="Z")rightShot("weak");
 if(e.key==="x"||e.key==="X")rightShot("strong");
 if(e.key==="1")state.stopShoot=!state.stopShoot;
 if(e.key==="2")state.holdStop=!state.holdStop;
 if(e.key==="3")state.oneTwo=!state.oneTwo;
 if(e.key==="4")state.roundStop=!state.roundStop;
 updateUI();
});

resize();
setLcdTheme("NORMAL");
setHandlePower(.50);
state.holdStop=true;state.stopShoot=true;state.oneTwo=true;state.roundStop=true;
updateUI();
requestAnimationFrame(loop);
</script>
</body>
</html>
